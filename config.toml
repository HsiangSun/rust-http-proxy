# ============================================================================
#  rust-http-proxy 默认配置文件
#  所有字段都可被同名大写环境变量覆盖，例如 PROXY_LISTEN=0.0.0.0:9090
# ============================================================================

#  ┌────────────────────┬─────────────────────────────────┬────────┬──────────────────────────────────────────────────────────────────────┬───────────────────────────────────────────┐
#  │        超时         │             配置项               │ 默认值  │                               作用范围                                 │                  触发后                   │
#  ├────────────────────┼─────────────────────────────────┼────────┼──────────────────────────────────────────────────────────────────────┼───────────────────────────────────────────┤
#  │ 建连超时             │ upstream.connect_timeout_secs   │ 10s    │ 仅 TCP 三次握手                                                        │ HTTP 路径转 Timeout，CONNECT 路径返回 504    │
#  ├────────────────────┼─────────────────────────────────┼────────┼──────────────────────────────────────────────────────────────────────┼───────────────────────────────────────────┤
#  │ 整体 IO 超时         │ server.io_timeout_secs          │ 60s    │ HTTP：等上游返回响应头+读完响应体；CONNECT：隧道单次 read 的最大空闲          │ HTTP 返回 504；CONNECT 隧道中断              │
#  ├────────────────────┼─────────────────────────────────┼────────┼──────────────────────────────────────────────────────────────────────┼───────────────────────────────────────────┤
#  │ 上游连接池空闲超时     │ upstream.pool_idle_timeout_secs │ 90s    │ keep-alive 闲置多久后关闭复用连接                                        │ 连接被池回收，下次请求要新建                   │
#  └────────────────────┴─────────────────────────────────┴────────┴──────────────────────────────────────────────────────────────────────┴───────────────────────────────────────────┘

[server]
# 代理对外监听地址。多个 worker 会通过 SO_REUSEPORT 绑定到同一地址。
listen = "0.0.0.0:8080"
# 启用 SO_REUSEPORT 的 worker 数；0 表示使用当前 CPU 核心数。
workers = 0
# 单条连接的整体读写超时（秒）。
io_timeout_secs = 60

[metrics]
# Prometheus 指标暴露地址 (GET /metrics)。
listen = "0.0.0.0:9090"
# 按 host 维度的耗时直方图最多保留多少个 host 标签。
# 随机域名（尤其是无法解析的域名）会不断制造新的 label series，
# 超过该上限后新 host 统一折叠为 other，避免内存缓慢上涨。
max_host_labels = 1024

[dns]
# 缓存 TTL（秒）。题目要求 1 分钟。
ttl_secs = 60
# 缓存最大条目数，超过后优先淘汰过期条目，不够再随机驱逐。
max_entries = 10_000
# 单次 DNS 解析超时（秒）。异常 DNS 环境下避免请求长期挂起。
timeout_secs = 5

[upstream]
# 上游 keep-alive 连接池每个 host 的最大空闲连接数。
pool_max_idle_per_host = 64
# 空闲连接最长保持时长（秒）。
pool_idle_timeout_secs = 90
# 建连超时（秒）。
connect_timeout_secs = 10

[security]
# 禁止访问私网/回环/链路本地/组播/保留地址（防 SSRF、云元数据、DNS rebinding）。
# 强烈建议保持 true。
block_private_ips = true
# 禁止客户端直接使用 IP 字面量作为目标；如需直连公网 IP 可设为 false。
block_ip_literals = false
# 允许的目标端口；为空表示不限制。默认只放行 HTTP/HTTPS。
allowed_ports = [80, 443]
# 域名白名单：非空时只允许匹配的目标，例如 ["*.example.com", "api.partner.com"]。
domain_allowlist = []
# 域名黑名单：匹配的目标一律拒绝，例如 ["*.phishing.example", "bad.example"]。
# 用于在网关侧统一拦截已知恶意/钓鱼域名。
domain_blocklist = []

[openobserve]
# 是否启用日志上报。
enabled = false
# OpenObserve 入口。
#   * 本地调试：http://127.0.0.1:5080
#   * EKS 内 NLB 暴露：http://<internal-nlb-dns>:5080
endpoint = "http://127.0.0.1:5080"
organization = "default"
stream = "proxy_logs"
# Basic Auth 凭证（建议通过环境变量 OO_USERNAME / OO_PASSWORD 注入）。
username = ""
password = ""
# 批量上报参数。
batch_size = 200
flush_interval_ms = 1000
# 通道缓冲，超出后将丢弃最旧日志以保护代理主路径。
channel_capacity = 10_000
# 业务分组标签，每条日志会自动注入顶层字段 proxy_group=<该值>。
# 多组代理共享同一 stream 时用它在 OpenObserve UI 里过滤；
# 与 VictoriaMetrics 抓取里的 proxy_group label 保持一致即可。
proxy_group = ""
